<!--
  Classical: the seven-circuit labyrinth of Crete in its round form, one path with no choices. It
  comes up the axis, walks the circuits in the order 3, 2, 1, 4, 7, 6, 5, each nearly all the way
  round, turning in nested half circles beside the axis, and ends in the pink centre. The colour
  follows the circuit, lavender outside to peach inside.
-->

<!--
  Paradox: an impossible triangle, three beams that each pass in front of the next. Every face
  colour runs unbroken across two beams that cannot both be where the eye puts them. A hairline
  gap separates the faces, as at the crossings of the rings and the knot, and the outline and the
  hole are rounded through a clip, which leaves the edges between faces sharp.
-->

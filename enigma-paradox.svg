    <clipPath id="enigma-paradox-outline">
      <path d="M23.51 175.16L105.17 33.71A20 20 0 0 1 122.49 23.71L133.51 23.71A20 20 0 0 1 150.83 33.71L232.49 175.16A20 20 0 0 1 232.49 195.16L226.99 204.7A20 20 0 0 1 209.67 214.7L46.33 214.7A20 20 0 0 1 29.01 204.7L23.51 195.16A20 20 0 0 1 23.51 175.16ZM109.93 143.62L121.07 124.33A8 8 0 0 1 134.93 124.33L146.07 143.62A8 8 0 0 1 139.14 155.62L116.86 155.62A8 8 0 0 1 109.93 143.62Z" clip-rule="evenodd"/>
    </clipPath>
  </defs>

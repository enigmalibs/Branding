<!--
  Knot: the trefoil, the simplest knot that cannot be untied without cutting it. One closed strand
  crosses itself three times, alternately over and under, with a gap at each under-crossing. The
  strand changes colour inside those gaps, so it reads as three pieces that are really one.
-->
